<div class="toast-div fixed top-5 left-1/2 -translate-x-1/2 z-50 w-full max-w-sm px-4 ">
  @if (message()) {
    <div [id]="'toast-' + toastType"
        class="flex items-center w-full h-12 p-4 rounded-base shadow-lg border rounded-sm "
        [ngClass]="{
            'text-green-800 bg-green-50 border-green-200': toastType === 'success',
            'text-red-800 bg-red-50 border-red-200': toastType === 'error',
            'text-blue-800 bg-blue-50 border-blue-200': toastType === 'info'
        }"
        role="alert">

        <div class="ms-3 text-sm font-medium">{{message()}}</div>
        
        <button type="button" (click)="toastCancel()"
            class="ms-auto mr-3 flex items-center justify-center bg-transparent hover:bg-black/5 rounded text-sm h-8 w-8 focus:outline-none transition-colors"
            aria-label="Close">
            <span class="sr-only">Close</span>
            <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6" />
            </svg>
        </button>
    </div>
  }
</div>
