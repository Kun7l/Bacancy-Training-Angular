@if (statsBarData()) {
<div class="stats-bar">
    <div class="stats">
        <p>Wishlist  <span class="stats-inner-span"> {{statsBarData().wishlist}}</span></p>
        <p>Applied  <span> {{statsBarData().applied}}</span></p>
        <p>Interview  <span> {{statsBarData().interview}}</span></p>
        <p>Offer  <span> {{statsBarData().offer}}</span></p>
    </div>
</div>
}
