<div class="edit-job-form">
  <h3>Edit Job</h3>
  <form [formGroup]="editJobForm" (ngSubmit)="onSubmit()">
    <div class="form-field">
      <label for="edit-company">Company</label>
      <input id="edit-company" type="text" formControlName="company" />
    </div>

    <div class="form-field">
      <label for="edit-role">Role</label>
      <input id="edit-role" type="text" formControlName="role" />
    </div>

    <div class="form-field">
      <label for="edit-date-applied">Date Applied</label>
      <input id="edit-date-applied" type="date" formControlName="date_applied" />
      @if (editJobForm.controls.date_applied.touched && editJobForm.controls.date_applied.errors?.['futureDate']) {
        <small>Date cannot be in the future.</small>
      }
    </div>

    <div class="form-field">
      <label for="edit-status">Status</label>
      <select id="edit-status" formControlName="status">
        <option value="wishlist">Wishlist</option>
        <option value="applied">Applied</option>
        <option value="interview">Interview</option>
        <option value="offer">Offer</option>
      </select>
    </div>

    <div class="form-field">
      <label for="edit-job-url">Job Url</label>
      <input id="edit-job-url" type="text" formControlName="job_url" />
    </div>

    <div class="form-field">
      <label for="edit-note">Note</label>
      <textarea id="edit-note" formControlName="note"></textarea>
    </div>

    <button type="submit" [disabled]="editJobForm.invalid">Save Changes</button>
  </form>
</div>
