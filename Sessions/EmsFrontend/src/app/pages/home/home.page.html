<main class="home-page">
  <section class="card intro">
    <p class="eyebrow">Home</p>
    <h1>Welcome</h1>
    <p>
      {{ token() ? 'Token is stored in local storage.' : 'You are not logged in yet.' }}
    </p>

    @if (token()) {
      <code>{{ token() }}</code>
      <button type="button" (click)="logout()">Logout</button>
    } @else {
      <a routerLink="/login" class="button-link">Go to login</a>
    }

    <a routerLink="/events" class="button-link">View all events</a>
    <a routerLink="/events/create" class="button-link">Create event</a>
  </section>

</main>
