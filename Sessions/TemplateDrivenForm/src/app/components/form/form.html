<div class="form-container">
    <form #tdForm="ngForm" (ngSubmit)="onSubmit(tdForm)">
        <div class="form-group" ngModelGroup="nameGroup">
            <div class="form-field">
                <label for="">First Name</label>
                <input type="text" name="firstName" ngModel #fullName="ngModel" required minlength="5">
            </div>
            <span class="error-message" *ngIf="fullName.errors?.['minlength']">Min length 5</span>
            <div class="form-field">
                <label for="">Last Name</label>
                <input type="text" name="lastName" ngModel #lastName="ngModel" required minlength="5">
            </div>
            <span class="error-message" *ngIf="lastName.errors?.['minlength']">Min length 5</span>
        </div>
        <div class="form-group">
            <div class="form-field">
                <label for="">Email</label>
                <input type="email" name="email" ngModel #email="ngModel" email required>
            </div>
        </div>
        <div class="form-group">
            <div class="form-field">
                <label for="">Phone number</label>
                <input type="tel" name="phoneNumber" #phoneNumber="ngModel" ngModel required>
            </div>
            
        </div>
        <div class="form-group">
            <div class="form-field">
                <label for="">Password</label>
                <input type="password" name="password" #password="ngModel" ngModel required minlength="5">
            </div>
            <span class="error-message" *ngIf="password.errors?.['minlength']">Min length 5</span>
        </div>
        <div class="form-group">
            <div class="form-field">
                <label for="">Gender</label>
                <input type="radio" name="gender" [value]="'male'" ngModel required>Male
                <input type="radio" name="gender" [value]="'female'" ngModel required>Female
            </div>
        </div>
        <div class="form-group">
            <div class="form-field">
                <label for="">Address pincode</label>
                <input type="number" name="pincode" ngModel required>
            </div>
        </div>
        <div class="form-group">
            <div class="form-field">
                <label for="">City</label>
                <select name="city" ngModel required>
                    <option value="" selected disabled hidden>Select city</option>
                    <option value="surat" selected>Surat</option>
                    <option value="ahmedabad">Ahmedabad</option>
                    <option value="rajkot">Rajkot</option>
                </select>
            </div>
        </div>
        <div class="form-grup">
            <div class="form-field">
                <input type="checkbox" name="rememberMe" ngModel>
                <label for="">Remember Me</label>
            </div>
        </div>
        <div class="button-div">
            <button type="submit" class="submit" [disabled]="tdForm.invalid">
                Submit
            </button>
            <Button type="reset" class="reset">Reset</Button>
        </div>
    </form>
</div>
