<div class="container">
    <div class="posts">
        @for (post of postList; track $index) {
            <div class="post">
                <h3>{{post.title}}</h3>
                <p>{{post.content}}</p>
                <p>Likes: {{post.likes}}</p>
                <p>Posted On : {{post.dateOfPosting.toLocaleDateString()}}</p>
            </div>
        }
    </div>
</div>
