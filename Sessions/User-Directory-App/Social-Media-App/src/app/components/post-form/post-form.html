<div class="container">
    <form [formGroup]="postForm" (ngSubmit)="addPost()">
        <Label for="postTitle">Title</Label>
        <input id="postTitle" type="text"  formControlName="postTitle" placeholder="Enter post title">
        <label for="postContent">Content</label>
        <input type="text" id="postContent"  formControlName="postContent" placeholder="Enter post content">
        <button type="submit" class="post-submit-button" [disabled]="postForm.invalid" >Submit</button>
    </form>
</div>
