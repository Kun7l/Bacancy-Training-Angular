<div class="container">
    <form action="">
        <Label for="postTitle">Title</Label>
        <input id="postTitle" type="text" #postTitle>
        <label for="postContent">Content</label>
        <input type="text" id="postContent" #postContent>
        <button type="submit" (click)="addPost(postTitle.value,postContent.value)">Submit</button>
    </form>
</div>
