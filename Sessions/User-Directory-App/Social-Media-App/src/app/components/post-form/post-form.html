<div class="container">
    <form #postForm="ngForm">
        <label for="postTitle">Title</label>
        <input id="postTitle" type="text" name="title" ngModel #postTitle="ngModel">

        <label for="postContent">Content</label>
        <input type="text" id="postContent" name="content" ngModel #postContent="ngModel">

        <button type="button" [disabled]="!postForm.dirty && !isSaved()"
            (click)="addPost(postTitle.value, postContent.value)">
            Submit
        </button>

    </form>
</div>
