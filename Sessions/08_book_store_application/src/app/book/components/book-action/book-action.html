<div class="book-action-container">
    <form [formGroup]="bookForm" (ngSubmit)="onSubmit()" class="add-book-form" action="">
        <div class="form-field">
            <label for="book-title">Title</label>
            <input type="text" id="book-title" formControlName="title" [(ngModel)]="book().title">
        </div>
        <div class="form-field">
            <label for="book-author">Author</label>
            <input type="text" id="book-author" formControlName="author" [(ngModel)]="book().author">
        </div>
        <div class="form-field">
            <label for="book-description">Description</label>
            <input type="text" id="book-description" formControlName="description" [(ngModel)]="book().description">
        </div>
        <div class="form-field">
            <label for="book-price">Price</label>
            <input type="number" name="bookPrice" id="book-price" formControlName="price" [(ngModel)]="book().price">
        </div>

        <button type="submit">@if (isAddActive()) {Add Book} @else{Update Book}</button>

    </form>
    <button (click)="closeButton()">Close</button>
</div>
