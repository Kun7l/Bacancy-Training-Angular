<div class="book-item-container">
    <h3>{{book.title}}</h3>
    <p>{{book.author}}</p>
    <p>{{book.price}}</p>
    <img src="{{book.imgSource}}" alt="{{book.title}} Image">
    @if (isViewMoreClicked()) {
    <p>{{book.description}}</p>
    }
    <button (click)="deleteBook(book.id)">Delete</button>
    <Button (click)="viewMoreToggle()">@if (isViewMoreClicked()) {
        View Less
        }
        @else {
        View More
        }</Button>
</div>
