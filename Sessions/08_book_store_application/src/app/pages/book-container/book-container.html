<div class="book-container">
    <button (click)="isAddActive.set(true)">Add Book</button>
    @if (isAddActive() == true && isEditActive() == false ) {
        <app-book-action (addBookEvent)="addBook($event)"/>
    }
    @else if( isEditActive() == true && isAddActive() == false){
        <app-book-action [book]="tempBook" (editBookEvent)="editBookFunction($event)"/>
    }
    <app-book-list [bookList]="bookList()"  (deleteBookEvent)="deleteBook($event)" (editBookEvent)="editBook($event)"/>
</div>
