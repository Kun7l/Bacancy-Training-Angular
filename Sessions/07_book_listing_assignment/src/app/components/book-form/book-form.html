<p>book-form works!</p>
<form [formGroup]="bookForm" (ngSubmit)="onSubmit()" class="add-book-form" action="">
    <div class="form-field">
        <label for="book-title">Title</label>
        <input type="text" id="book-title" formControlName="title" >
    </div>
    <div class="form-field">
        <label for="book-author">Author</label>
        <input type="text" id="book-author" formControlName="author">
    </div>
    <div class="form-field">
        <label for="book-description">Description</label>
        <input type="text" id="book-description" formControlName="description">
    </div>
    <div class="form-field">
        <label for="book-price">Price</label>
        <input type="number" name="bookPrice" id="book-price" formControlName="price">
    </div>

    <button type="submit">Add book</button>
</form>
