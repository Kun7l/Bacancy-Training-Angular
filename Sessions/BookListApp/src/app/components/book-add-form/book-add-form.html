<div class="add-book card border-0 shadow-sm mx-auto">
    <div class="card-body p-4 p-md-5">
        <div class="d-flex align-items-center justify-content-between gap-3 mb-4">
            <div>
                <h2 class="h4 mb-1">Add a new book</h2>
                <p class="text-muted mb-0">Capture the book title, category, and price.</p>
            </div>
            <span class="badge text-bg-primary">New entry</span>
        </div>

        <form [formGroup]="bookFormGroup" (ngSubmit)="onSubmit()" class="row g-3">
            <div class="col-12">
                <label class="form-label fw-semibold">Title</label>
                <input type="text" class="form-control" formControlName="title" />
            </div>

            <div class="col-12">
                <label class="form-label fw-semibold">Author</label>
                <input type="text" class="form-control" formControlName="author" />
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label fw-semibold">Category</label>
                <select class="form-select" formControlName="category">
                    <option value="sports">Sports</option>
                    <option value="selfhelp">Self Help</option>
                    <option value="horror">Horror</option>
                </select>
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label fw-semibold">Price</label>
                <input type="number" class="form-control" formControlName="price" />
            </div>

            <div class="col-12">
                <label class="form-label fw-semibold">Book Cover Image</label>
                <input type="file" class="form-control" accept="image/*" (change)="onImageSelected($event)" />
                <div class="form-text">Select an image from your device.</div>
            </div>

            @if (bookFormGroup.get('imageUrl')?.value) {
            <div class="col-12">
                <img [src]="bookFormGroup.get('imageUrl')?.value" alt="Book preview" class="img-fluid rounded border"
                    style="max-height: 220px; object-fit: cover;" />
            </div>
            }

            <div class="col-12 d-flex gap-2 justify-content-end pt-2">
                <button type="button" class="btn btn-outline-secondary" (click)="setValueFn()">Set value</button>
                <button type="submit" class="btn btn-success">Submit</button>
            </div>
        </form>
    </div>
</div>
